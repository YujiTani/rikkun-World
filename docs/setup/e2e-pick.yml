# #444 CI の 直しを 落ちた テストだけで 回す ための ワークフロー。
# これを .github/workflows/e2e-pick.yml と して 新しく 足す（yuzu が 画面で。ci.yml は そのまま）。
# スレッドが GitHub の API（workflow_dispatch）で ブランチと spec の 名前を わたして 回す。数分で 終わる。
# 必須チェックの 名前（「型チェックとユニットテスト」「E2E（全部）」）とは べつの 名前に してある（えらんだ 分だけで 緑に 見えないように）。
name: E2E えらんだ spec

on:
  workflow_dispatch:
    inputs:
      specs:
        description: 回す spec（空白で 区切る。例 "e2e/m7.spec.ts e2e/smoke.spec.ts"。行の 番号つき "e2e/m7.spec.ts:120" も 可）
        required: true
        type: string
      repeat:
        description: 同じ テストを 何回 くりかえすか（ゆれを 見る とき 3 など）
        required: false
        default: '1'
        type: string

concurrency:
  group: e2e-pick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pick:
    name: E2E（えらんだ spec）
    runs-on: ubuntu-24.04
    # ci.yml と 同じ Playwright の コンテナ（版を 上げる ときは ここも）
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      # 入力は そのまま シェルに 入れない（env で わたして、e2e/ の spec の 形だけ 通す）
      - name: えらんだ spec を 回す
        env:
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -eu
          case "$REPEAT" in ''|*[!0-9]*) echo "repeat は 数で"; exit 1;; esac
          for s in $SPECS; do
            echo "$s" | grep -qE '^e2e/[A-Za-z0-9_./-]+\.spec\.ts(:[0-9]+)?$' || { echo "spec の 形では ない: $s"; exit 1; }
            case "$s" in *..*) echo "spec の 形では ない: $s"; exit 1;; esac
          done
          echo "回す: $SPECS（${REPEAT} 回）"
          npx playwright test $SPECS --repeat-each "$REPEAT" --reporter=list,html
      - name: 失敗したときのレポートとスクショ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pick
          path: |
            playwright-report/
            test-results/
          retention-days: 7
