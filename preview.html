<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ようかいみほん</title>
    <link rel="stylesheet" href="/src/preview/preview.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="labels"></div>
    <div id="controls">
      <div class="row">
        <div class="group">
          <button type="button" data-action="color" class="b-color">いろ</button>
          <button type="button" data-action="shadow" class="b-shadow">かげ</button>
        </div>
        <div class="group">
          <button type="button" data-action="wait" class="b-motion b-round">まつ</button>
          <button type="button" data-action="move" class="b-motion b-round">うごく</button>
          <button type="button" data-action="attack" class="b-motion b-round">こうげき</button>
          <button type="button" data-action="hit" class="b-motion b-round">たたかれた</button>
          <button type="button" data-action="die" class="b-motion b-round">たおれる</button>
        </div>
        <div class="group">
          <button type="button" data-action="spin" class="b-view">まわす</button>
          <button type="button" data-action="stop" class="b-view">とめる</button>
          <button type="button" data-action="front" class="b-view b-tab">まえ</button>
          <button type="button" data-action="side" class="b-view b-tab">よこ</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
