name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-fast:
    name: 型チェックとユニットテスト
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check:fast

  # PR の 変更が ドキュメントだけ（docs/・.md・.claude/）なら E2E を とばす。main への push は いつも 全部 回す
  changes:
    name: 変更の 中身
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$|^\.claude/'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  e2e:
    name: E2E（${{ matrix.shard }}/5）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Chromium と その部品が 入った Playwright の コンテナで 動かす（毎回 apt で 入れると ときどき 10 分 以上 かかる）。
    # 版は package.json の @playwright/test と 同じに する（上げる ときは ここも 上げる）
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      # 件数でなく 前の 時間（e2e/shard-times.json）で 5 つに 分ける（scripts/e2e-shard.mjs）
      - name: E2E（5 つに分けた ${{ matrix.shard }} つ目）
        run: npx playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 5) --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: 失敗したときのレポートとスクショ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: UI 検査の結果とスクショ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-report-${{ matrix.shard }}
          path: ui-gate-report/
          if-no-files-found: ignore
          retention-days: 7

  # 5 つ全部が通ったかを、前と同じ名前の 1 つのチェックにまとめる（必須チェックの名前を変えないため）
  e2e-all:
    name: E2E（全部）
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # ドキュメントだけの PR は E2E を とばして 緑（変更の 中身の ジョブが 落ちたら 赤）
      - name: 5 つの結果をたしかめる
        run: |
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then test "${{ needs.e2e.result }}" = "success"; fi
