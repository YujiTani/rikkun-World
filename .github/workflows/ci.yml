name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-fast:
    name: 型チェックとユニットテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:fast

  e2e:
    name: E2E（全部）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright の Chromium を入れる
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: 失敗したときのレポートとスクショ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: UI 検査の結果とスクショ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-report
          path: ui-gate-report/
          retention-days: 7
