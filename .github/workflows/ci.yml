name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-fast:
    name: 型チェックとユニットテスト
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:fast

  e2e:
    name: E2E（${{ matrix.shard }}/4）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright の Chromium を入れる
        run: npx playwright install --with-deps chromium
      - name: E2E（4 つに分けた ${{ matrix.shard }} つ目）
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: 失敗したときのレポートとスクショ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: UI 検査の結果とスクショ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-report-${{ matrix.shard }}
          path: ui-gate-report/
          if-no-files-found: ignore
          retention-days: 7

  # 3 つ全部が通ったかを、前と同じ名前の 1 つのチェックにまとめる（必須チェックの名前を変えないため）
  e2e-all:
    name: E2E（全部）
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 3 つの結果をたしかめる
        run: test "${{ needs.e2e.result }}" = "success"
