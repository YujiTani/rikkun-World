# #444 直しの push では「まえの 回で 落ちた テスト」だけを 先に 回す ci.yml（これで .github/workflows/ci.yml を まるごと 置きかえる。yuzu が 画面で）。
# 前と ちがう 所: 「変更の 中身」が 同じ ブランチの まえの 回の 落ちた テスト（Playwright の .last-run.json）を 集める /
# e2e-first の ジョブ（その テストだけ 数分で 回す。落ちたら 6 シャードは 回さず すぐ 赤）/ 各シャードが 落ちた テストの 一覧を e2e-last-run-<n> に 残す。
# まえの 回が 緑・はじめての push・一覧が とれない ときは 今までどおり すぐ 全部を 回す（落ちない）。だれも 何も 操作 しなくて よい。
name: CI

on:
  pull_request:
    # ready_for_review: スレッドが draft に して すぐ やめると 回し直せる（ランナーの 不調で 止まった とき。#444）
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # 前の main の E2E の 時間（e2e-times-*）を もらう

jobs:
  check-fast:
    name: 型チェックとユニットテスト
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check:fast
      # ラチェット（#310）: コードのきまり違反の数が ratchet.json の上限より ふえたら 失敗。約 25 秒
      - name: コードのきまり（ラチェット）
        run: npm run check:ratchet
      # ICON-32: art/icons32/*.png から アトラスを 作りなおして 差分が ないか（作り忘れの 検出）
      - name: アイコンの アトラス
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 art/ICON-32/pack.py --check

  # PR の 変更が ドキュメントだけ（docs/・.md・.claude/）なら E2E を とばす。main への push は いつも 全部 回す
  changes:
    name: 変更の 中身
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      times: ${{ steps.times.outputs.times }}
      first: ${{ steps.first.outputs.first }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$|^\.claude/'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

      # いちばん 新しい 緑の main の CI が 残した spec ごとの 時間（#311）。5 つの シャードが 同じ 表で 分けるよう、ここで 1 つに まとめて わたす
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run=""
          for id in $(gh run list -R "$REPO" -w CI -b main -L 10 --json databaseId -q '.[].databaseId' || true); do
            if gh api "repos/$REPO/actions/runs/$id/artifacts" -q '.artifacts[].name' 2>/dev/null | grep -q '^e2e-times-'; then run=$id; break; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
      
      - if: steps.last.outputs.run != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-times-*
          merge-multiple: true
          path: e2e-times-prev
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - id: times
        run: |
          if ls e2e-times-prev/*.json >/dev/null 2>&1; then echo "times=$(jq -sc 'add' e2e-times-prev/*.json || true)" >> "$GITHUB_OUTPUT"; fi

      # まえの 回で 落ちた テスト（#444）: 同じ ブランチの、落ちた テストの 一覧（e2e-last-run-*）が 残って いる いちばん 新しい 回から 集める。
      # 60 本を こえる ときは 全体が こわれて いるので 先には 回さない（すぐ 全部）
      - id: prev
        if: github.event_name == 'pull_request' && steps.diff.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          run=""
          for id in $(gh run list -R "$REPO" -w CI -b "$HEAD_REF" -e pull_request -L 8 --json databaseId -q '.[].databaseId' || true); do
            if [ "$id" = "$GITHUB_RUN_ID" ]; then continue; fi
            if gh api "repos/$REPO/actions/runs/$id/artifacts" -q '.artifacts[].name' 2>/dev/null | grep -q '^e2e-last-run-'; then run=$id; break; fi
          done
          echo "まえの 回: ${run:-（なし）}"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.prev.outputs.run != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-last-run-*
          path: last-run-prev
          run-id: ${{ steps.prev.outputs.run }}
          github-token: ${{ github.token }}
      - id: first
        run: |
          ids='[]'
          if ls last-run-prev/*/last-run.json >/dev/null 2>&1; then
            ids=$(jq -sc '[.[].failedTests[]? | select(type == "string" and test("^[0-9a-f]{20}-[0-9a-f]{20}$"))] | unique' last-run-prev/*/last-run.json || echo '[]')
          fi
          n=$(printf '%s' "$ids" | jq 'length' || echo 0)
          echo "まえの 回で 落ちた テスト: $n 本"
          if [ "$n" -ge 1 ] && [ "$n" -le 60 ]; then echo "first=$ids" >> "$GITHUB_OUTPUT"; fi

  # 直しの push（#444）: まえの 回で 落ちた テストだけを 先に 回す（数分）。落ちたら 6 シャードは 回さない（すぐ 赤が 分かる）。通ったら 全部へ
  e2e-first:
    name: E2E（まえに 落ちた テスト）
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.first != ''
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      # Playwright の --last-failed は test-results/.last-run.json の id（ファイルと テストの 名前から 作る。行が ずれても 同じ）だけを 回す。
      # 名前を 変えた・消した テストは 当たらない（--pass-with-no-tests。あとの 全部で 見る）
      - name: まえに 落ちた テストを 回す
        env:
          FIRST: ${{ needs.changes.outputs.first }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          mkdir -p test-results
          printf '%s' "$FIRST" | jq -c '{status: "failed", failedTests: .}' > test-results/.last-run.json
          npx playwright test --last-failed --pass-with-no-tests --reporter=list,html
      - name: 落ちた テストの 一覧を 作る（次の 回が 使う）
        if: ${{ !cancelled() }}
        run: mkdir -p e2e-last-run && cp test-results/.last-run.json e2e-last-run/last-run.json || true
      - name: 落ちた テストの 一覧を 残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-last-run-first
          path: e2e-last-run/
          if-no-files-found: ignore
          retention-days: 7
      - name: 失敗したときのレポートとスクショ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-first
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: E2E（${{ matrix.shard }}/6）
    needs: [changes, e2e-first]
    # e2e-first が ない（skipped）か 通った ときだけ。落ちた ときは 回さない
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && (needs.e2e-first.result == 'success' || needs.e2e-first.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Chromium と その部品が 入った Playwright の コンテナで 動かす（毎回 apt で 入れると ときどき 10 分 以上 かかる）。
    # 版は package.json の @playwright/test と 同じに する（上げる ときは ここも 上げる）
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: 前の main の 時間を おく
        env:
          TIMES: ${{ needs.changes.outputs.times }}
        run: |
          mkdir -p e2e-times-prev
          if [ -n "$TIMES" ]; then printf '%s' "$TIMES" > e2e-times-prev/main.json; fi
      # 件数でなく 時間で 5 つに 分ける（scripts/e2e-shard.mjs）。前の main の 時間 → e2e/shard-times.json → テストの 本数で 見つもり の 順
      - name: E2E（5 つに分けた ${{ matrix.shard }} つ目）
        run: npx playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 6) --reporter=list,html,json
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-result.json
          E2E_TIMES_DIR: e2e-times-prev
      - name: この シャードの 時間を 作る（次の CI が 使う）
        if: always()
        run: mkdir -p e2e-times && node scripts/e2e-shard-times.mjs --out e2e-times/shard-${{ matrix.shard }}.json e2e-result.json || true
      - name: この シャードの 時間を 残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-times-${{ matrix.shard }}
          path: e2e-times/
          if-no-files-found: ignore
          retention-days: 30
      # 途中で 止められた 回（cancelled）は 残さない（中身が 半分で、落ちた テストを 見おとすため）
      - name: 落ちた テストの 一覧を 作る（次の 回が 先に 回す。#444）
        if: ${{ !cancelled() }}
        run: mkdir -p e2e-last-run && cp test-results/.last-run.json e2e-last-run/last-run.json || true
      - name: 落ちた テストの 一覧を 残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-last-run-${{ matrix.shard }}
          path: e2e-last-run/
          if-no-files-found: ignore
          retention-days: 7
      - name: 失敗したときのレポートとスクショ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: UI 検査の結果とスクショ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-report-${{ matrix.shard }}
          path: ui-gate-report/
          if-no-files-found: ignore
          retention-days: 7

  # 5 つ全部が通ったかを、前と同じ名前の 1 つのチェックにまとめる（必須チェックの名前を変えないため）
  e2e-all:
    name: E2E（全部）
    needs: [changes, e2e-first, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # ドキュメントだけの PR は E2E を とばして 緑（変更の 中身の ジョブが 落ちたら 赤）
      - name: 5 つの結果をたしかめる
        run: |
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.e2e-first.result }}" = "failure" ]; then echo "まえに 落ちた テストが まだ 落ちる（6 シャードは 回して いない）"; exit 1; fi
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then test "${{ needs.e2e.result }}" = "success"; fi
